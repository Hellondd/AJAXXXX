<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#f3f6fb"/>
  <text x="70" y="75" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#174ea6">Жизненный цикл запроса ASP.NET Core</text>
  <text x="70" y="115" font-family="Arial, sans-serif" font-size="20" fill="#667085">ASPDZ: middleware обрабатывают запрос до и после endpoint.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="210" width="190" height="95" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="165" y="250" font-size="20" font-weight="700" fill="#1e40af">Middleware 1</text>
    <text x="165" y="278" font-size="16" fill="#1e40af">запрос получен</text>
    <path d="M280 257 H365" stroke="#2563eb" stroke-width="4"/><path d="M365 257 l-15 -9 v18z" fill="#2563eb"/>
    <rect x="385" y="210" width="190" height="95" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="480" y="250" font-size="20" font-weight="700" fill="#1e40af">Middleware 2</text>
    <text x="480" y="278" font-size="16" fill="#1e40af">маршрутизация</text>
    <path d="M595 257 H680" stroke="#2563eb" stroke-width="4"/><path d="M680 257 l-15 -9 v18z" fill="#2563eb"/>
    <rect x="700" y="210" width="190" height="95" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="795" y="250" font-size="20" font-weight="700" fill="#166534">Endpoint</text>
    <text x="795" y="278" font-size="16" fill="#166534">обработка формы</text>
    <path d="M795 325 V385 H480 V325" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M480 325 l-9 15 h18z" fill="#64748b"/>
  </g>
  <text x="480" y="430" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">Ответ возвращается обратно: Endpoint → Middleware 2 → Middleware 1 → клиент</text>
</svg>
